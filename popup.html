<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { width: 380px; margin: 0; font: 13px system-ui, sans-serif; color: #222; }
  header { background: #3390ec; color: #fff; padding: 10px 12px; font-weight: 600; }
  .bar { display: flex; gap: 6px; padding: 8px 12px; flex-wrap: wrap; border-bottom: 1px solid #eee; }
  .bar label { display: flex; align-items: center; gap: 3px; }
  .actions { display: flex; gap: 6px; padding: 8px 12px; }
  button { flex: 1; border: 0; border-radius: 6px; padding: 7px; cursor: pointer; background: #e8f1fd; color: #1a6fc9; font-weight: 600; }
  button.primary { background: #3390ec; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #list { max-height: 360px; overflow-y: auto; padding: 0 12px; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f2f2f2; }
  .thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: #ddd; display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }
  .meta { flex: 1; min-width: 0; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #eee; }
  .muted { color: #888; font-size: 11px; }
  #status { padding: 8px 12px; color: #555; min-height: 16px; }
</style>
</head>
<body>
  <header>Telegram Media Extractor</header>
  <div class="bar" id="filters">
    <label><input type="checkbox" value="image" checked>Imágenes</label>
    <label><input type="checkbox" value="video" checked>Videos</label>
    <label><input type="checkbox" value="gif" checked>GIFs</label>
    <label><input type="checkbox" value="audio" checked>Audios</label>
    <label><input type="checkbox" value="sticker">Stickers</label>
  </div>
  <div class="actions">
    <button id="scan">🔍 Escanear</button>
    <button id="all" class="primary" disabled>⬇ Descargar seleccionados</button>
  </div>
  <div class="actions">
    <button id="backup" class="primary">🗂 Backup de todo el chat (fotos y videos)</button>
  </div>
  <div id="list"></div>
  <div id="status">Abrí un chat en web.telegram.org y presioná Escanear.</div>
  <script src="popup.js"></script>
</body>
</html>
